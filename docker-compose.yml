# Optional: Neo4j as a read projection of the Lattice ledger.
# Lattice itself needs nothing but Python and SQLite.
services:
  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-lattice-dev-only}
      NEO4J_PLUGINS: '["apoc"]'
    volumes: ["./neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 30
  workspace:
    profiles: ["devcontainer"]
    image: mcr.microsoft.com/devcontainers/python:3.12
    command: sleep infinity
    volumes: [".:/workspaces/lattice:cached"]
    environment:
      LATTICE_NEO4J_URI: bolt://neo4j:7687
      LATTICE_NEO4J_USER: neo4j
      LATTICE_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-lattice-dev-only}
    depends_on: [neo4j]
